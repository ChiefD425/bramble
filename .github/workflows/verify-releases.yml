# Checks, every day, that what users get is what the source says (docs/reproducible-builds.md):
# rebuilds the extension each store is serving right now from its tag and compares it file by file
# with the store's package and the GitHub release.
#
# The script needs only Docker and network, so anyone can run it, and a failure here is for the
# maintainer to explain in public.

name: Verify releases

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "An extension release to rebuild instead of what the stores serve (e.g. 1.37.0-firefox)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  extension:
    name: Rebuild ${{ matrix.target }}
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [firefox, chromium]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags: the build is of the tag the store's version names.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Rebuild what the store serves and compare
        env:
          TARGET: ${{ matrix.target }}
        run: node scripts/verify-release.ts --live "$TARGET"

  tag:
    name: Rebuild ${{ inputs.tag }}
    if: ${{ inputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Rebuild the tag and compare
        env:
          TAG: ${{ inputs.tag }}
        run: node scripts/verify-release.ts "$TAG"

